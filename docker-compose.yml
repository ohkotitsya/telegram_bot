# One-command run for the Telegram AI chatbot.
#
#   cp .env.example .env    # fill in TELEGRAM_BOT_TOKEN and ANTHROPIC_API_KEY
#   docker compose up -d
#   docker compose logs -f
#
# The container reads secrets from the environment; .env is never copied
# into the image.

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: telegram-bot:latest
    container_name: telegram-bot
    restart: unless-stopped

    # Secrets come from your local .env file (or from the real environment).
    # BOT_SKIP_DOTENV=1 is already set in the image, so the container reads
    # these from the environment and not from a file inside the image.
    env_file:
      - .env

    environment:
      # Uncomment to override the model used by the bot:
      # ANTHROPIC_MODEL: claude-sonnet-5-5

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
