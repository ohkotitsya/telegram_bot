[project]
name = "telegram-bot"
version = "0.0.1"
description = "Telegram chatbot powered by Claude (Anthropic), with web search"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Kauã Caethel" }]
keywords = ["telegram", "bot", "anthropic", "claude", "chatbot"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
]

# Runtime dependencies. These mirror requirements.txt — which stays the
# source of truth for the Docker build and CI — so that `pip install .`
# produces a working install.
dependencies = [
    "python-telegram-bot>=21.0",
    # >=1.13.0 : required for thinking={"type": "adaptive"}
    # <2.0.0   : verified against the 1.x SDK
    "anthropic>=1.13.0,<2.0.0",
    "python-dotenv>=1.0",
    "ddgs>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "build>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai", "config", "handlers"]

[tool.hatch.build.targets.sdist]
include = [
    "/ai",
    "/config",
    "/handlers",
    "/main.py",
    "/requirements.txt",
    "/README.md",
    "/LICENSE",
]

# ---------------------------------------------------------------------------
# Ruff — linting & formatting
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "venv", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort — import order
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    # Network calls (DuckDuckGo, Wikipedia, page fetch) legitimately catch
    # broad Exception: any failure there must degrade to an empty result
    # rather than crash the bot's message loop. Each site logs the cause.
    "BLE001",
]

[tool.ruff.lint.per-file-ignores]
# Test files may use asserts and relaxed naming
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
